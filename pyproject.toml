[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lorenook-backend"
version = "0.1.0"
description = "LoreNook backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "uvicorn>=0.32,<1",
    "jinja2>=3.1.6,<4",
    "quickjs-ng>=0.17.0.1,<0.18",
    "PyYAML>=6.0.3,<7",
    "httpx>=0.28,<1",
    "websockets>=17.4,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.modules.presets" = ["examples/*.js"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
