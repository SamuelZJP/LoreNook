<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23A85C14'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'>L</text></svg>" />
    <title>LoreNook</title>
    <script>
      // Apply the stored theme before first paint to avoid a light flash in dark mode.
      try {
        const t = JSON.parse(localStorage.getItem('lorenook.prefs') || '{}').theme
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
